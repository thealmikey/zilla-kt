/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://jitpack.io')
    }

    maven {
        url = uri('https://maven.packages.aklivity.io/')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.io.minio.minio
    api libs.com.github.tinder.statemachine
    testImplementation libs.io.aklivity.zilla.engine
    testImplementation libs.junit.junit
    testImplementation libs.org.hamcrest.hamcrest.library
    testImplementation libs.org.mockito.mockito.core
    testImplementation libs.io.aklivity.k3po.control.junit
    testImplementation libs.io.aklivity.k3po.lang
    testImplementation libs.org.openjdk.jmh.jmh.core
    testImplementation libs.org.openjdk.jmh.jmh.generator.annprocess
    compileOnly libs.io.aklivity.zilla.binding.http.spec
    compileOnly libs.io.aklivity.zilla.engine
    compileOnly libs.org.jetbrains.kotlin.kotlin.stdlib
}

group = 'io.aklivity.zilla'
version = 'develop-SNAPSHOT'
description = 'zilla::runtime::binding-claimcheck'
java.sourceCompatibility = JavaVersion.VERSION_1_8

tasks.register('testsJar', Jar) {
    archiveClassifier = 'tests'
    from(sourceSets.test.output)
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
            artifact(testsJar)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
