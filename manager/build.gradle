/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://maven.packages.aklivity.io/')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.com.github.rvesse.airline
    api libs.org.eclipse.yasson
    api libs.org.apache.maven.maven.settings
    api libs.org.apache.maven.maven.settings.builder
    api libs.org.apache.maven.resolver.maven.resolver.api
    api libs.org.apache.maven.resolver.maven.resolver.connector.basic
    api libs.org.apache.maven.resolver.maven.resolver.impl
    api libs.org.apache.maven.resolver.maven.resolver.util
    api libs.org.apache.maven.resolver.maven.resolver.spi
    api libs.org.apache.maven.resolver.maven.resolver.supplier.mvn3
    api libs.org.sonatype.sisu.sisu.inject.plexus
    api libs.com.github.ajalt.clikt.clikt
    api libs.io.arrow.kt.arrow.core
    api libs.io.arrow.kt.arrow.fx.coroutines
    testImplementation libs.org.junit.jupiter.junit.jupiter
    testImplementation libs.org.jetbrains.kotlin.kotlin.test
    testImplementation libs.io.kotest.kotest.assertions.core.jvm
    testImplementation libs.org.junit.vintage.junit.vintage.engine
    testImplementation libs.org.hamcrest.hamcrest
    compileOnly libs.org.jetbrains.kotlin.kotlin.stdlib
}

group = 'io.aklivity.zilla'
version = 'develop-SNAPSHOT'
description = 'zilla::manager'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
