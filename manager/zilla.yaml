{
  "name": "example",
  "bindings": {
    "north_tcp_server": {
      "type": "tcp",
      "kind": "server",
      "options": {
        "host": "0.0.0.0",
        "port": 12345
      },
      "exit": "north_http_server"
    },

    "north_http_server": {
      "type": "http",
      "kind": "server",
      "options": {
        "versions": ["http/1.1"]
      },
      "routes": [
        {
          "when": [
            {
              "headers": {
                ":scheme": "http",
                ":method": "PUT",
                ":path": "/claim/image"
              }
            }
          ],
          "exit": "north_claimcheck_server_images"
        },
        {
          "when": [
            {
              "headers": {
                ":scheme": "http",
                ":method": "GET",
                ":path": "/claim/image/{uuid}"
              }
            }
          ],
          "exit": "north_claimcheck_server_images"
        },
        {
          "when": [
            {
              "headers": {
                ":scheme": "http",
                ":method": "PUT",
                ":path": "/claim/video"
              }
            }
          ],
          "exit": "north_claimcheck_server_videos"
        },
        {
          "when": [
            {
              "headers": {
                ":scheme": "http",
                ":method": "GET",
                ":path": "/claim/video/{uuid}"
              }
            }
          ],
          "exit": "north_claimcheck_server_videos"
        }
      ]
    },
    "north_claimcheck_server_images": {
      "type": "claimcheck",
      "kind": "proxy",
      "options": {
        "endpoint": "http://localhost:9000",
        "accessKey": "minio",
        "secretKey": "minio123",
        "bucket": "images"
      },
      "routes": [
        {
          "when": [
            {
              "headers": {
                ":path": "/claim/image",
                ":method": "PUT"
              }
            }
          ],
          "with": {
            "ttl": 3600,
            "maxPayloadSize": 10485760,
            "inMemoryThreshold": 4194304,
            "headers": {
              "X-Claim": "uuid",
              "Content-Type": "image/jpeg"
            },
            "presigned": true
          },
          "exit": "http_client"
        },
        {
          "when": [
            {
              "headers": {
                ":method": "GET",
                ":path": "/claim/image/{uuid}"
              }
            }
          ],
          "with": {
            "headers": {
              "Content-Type": "image/jpeg"
            },
            "presigned": true
          },
          "exit": "http_client"
        }
      ]
    },
    "north_claimcheck_server_videos": {
      "type": "claimcheck",
      "kind": "proxy",
      "options": {
        "endpoint": "http://localhost:9000",
        "accessKey": "minio",
        "secretKey": "minio123",
        "bucket": "mybucket"
      },
      "routes": [
        {
          "when": [
            {
              "headers": {
                ":path": "/claim/video",
                ":method": "PUT"
              }
            }
          ],
          "with": {
            "ttl": 7200,
            "maxPayloadSize": 52428800,
            "inMemoryThreshold": 10485760,
            "headers": {
              "X-Claim": "uuid",
              "Content-Type": "video/mp4"
            },
            "presigned": true
          },
          "exit": "http_client"
        },
        {
          "when": [
            {
              "headers": {
                ":method": "GET",
                ":path": "/claim/video/{uuid}"
              }
            }
          ],
          "with": {
            "headers": {
              "Content-Type": "video/mp4"
            },
            "presigned": true
          },
          "exit": "http_client"
        }
      ]
    },

    "http_client": {
      "type": "http",
      "kind": "client",
      "exit": "my_tcp"
    },

    "my_tcp": {
      "type": "tcp",
      "kind": "client"
    }
  },

  "telemetry": {
    "exporters": {
      "stdout_logs_exporter": {
        "type": "stdout"
      }
    }
  }
}
