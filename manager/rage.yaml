{
  "name": "example",
  "bindings": {
    "north_tcp_server": {
      "type": "tcp",
      "kind": "server",
      "options": {
        "host": "0.0.0.0",
        "port": 12345
      },
      "exit": "north_http_server"
    },
    "north_http_server": {
      "type": "http",
      "kind": "server",
      "options": {
        "versions": [ "http/1.1" ]
      },
      "routes": [
        {
          "when": [
            {
              "headers": {
                ":scheme": "http",
                ":method": "PUT"
              }
            }
          ],
          "exit": "north_claimcheck_server"
        }
      ]
    },
    "north_claimcheck_server": {
      "type": "claimcheck",
      "kind": "proxy",
      "options": {
        "endpoint": "http://localhost:9000",
        "accessKey": "minio",
        "secretKey": "minio123",
        "bucket": "mybucket"
      },
      "routes": [
        {
          "when": [
            {
              "headers": {
                ":path": "/claim",
                ":method":"PUT"
              }
            }
          ],
          "with": {
            "ttl": 3600,
            "maxPayloadSize": 10485760,
            "inMemoryThreshold": 4194304,
            "headers": {
              "X-Claim": "uuid",
              "Content-Type": "application/json"
            },
            "presigned": true
          },
          "exit": "north_echo_server"
        }
      ]
    },
    "north_echo_server": {
      "type": "echo",
      "kind": "server"
    }
  },
  "telemetry": {
    "exporters": {
      "stdout_logs_exporter": {
        "type": "stdout"
      }
    }
  }
}