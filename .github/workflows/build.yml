name: build

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ develop, 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub sources
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/io/aklivity/zilla
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven (Skip Tests)
        run: ./mvnw -B -U -nsu -DskipTests -Ddocker.logStdout -Ddocker.verbose -Dmaven.test.skip=true install
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # Removed GITHUB_TOKEN as it’s not needed for Maven build

      - name: Save Docker image
        if: success()
        run: |
          mkdir -p ~/docker-cache
          docker save -o ~/docker-cache/docker.tar $(docker images --format "{{.Repository}}" | grep "zilla")

      - name: Cache Docker image
        uses: actions/cache@v4
        if: success()
        with:
          path: ~/docker-cache/docker.tar
          key: zilla-develop-SNAPSHOT-${{ github.run_id }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Conditional Artifact Upload
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zilla-build-${{ github.event.number }}
          path: |
            **/hs_err_pid*.log
            **/target/surefire-reports/
            **/target/zilla-itests/
            **/target/failsafe-reports/