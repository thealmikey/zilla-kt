name: build

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ develop, 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    environment: Zilla Env
    steps:
      - name: Checkout GitHub sources
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Build with Maven (Skip Tests)
        run: ./mvnw -B -U -nsu -DskipTests=true -Ddocker.logStdout -Ddocker.verbose -Dcheckstyle.skip=true -Dlicense.skip=true install -e -v
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Save Docker image
        if: success()
        run: |
          mkdir -p ~/docker-cache
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "zillali" || echo "No zillali image found"
          docker save -o ~/docker-cache/docker.tar ghcr.io/thealmikey/zillali:develop-SNAPSHOT || echo "Failed to save Docker image"

      - name: Cache Docker image
        uses: actions/cache@v4
        if: success()
        with:
          path: ~/docker-cache/docker.tar
          key: zilla-develop-SNAPSHOT-${{ github.run_id }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Conditional Artifact Upload
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zilla-build-${{ github.event.number }}
          path: |
            **/hs_err_pid*.log
            **/target/surefire-reports/
            **/target/zilla-itests/
            **/target/failsafe-reports/