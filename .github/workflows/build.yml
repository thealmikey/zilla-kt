name: Build and Publish Docker Image

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ develop, 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    environment: Zilla Env

    steps:
      # 1️⃣ Checkout full repo history (important for versioning / changelog)
      - name: Checkout GitHub sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup JDK 22 (Temurin) instead of Zulu 21
      - name: Setup JDK 22 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin        # unified Eclipse Adoptium stack
          java-version: 22
          cache: maven                 # enables built-in Maven cache

      # 3️⃣ Optional: print versions to ensure environment alignment
      - name: Verify Java & Maven Versions
        run: |
          java -version
          ./mvnw -version

      # 4️⃣ Validate secrets are available
      - name: Validate CR_PAT Secret
        run: |
          if [ -n "${{ secrets.CR_PAT }}" ]; then
            echo "✅ CR_PAT secret is set"
          else
            echo "❌ CR_PAT secret is missing!"
            exit 1
          fi

      # 5️⃣ Build all Maven modules (clean build, skip tests)
      - name: Maven Build (Clean + Skip Tests)
        run: |
          ./mvnw clean install \
            -B -U \
            -DskipTests \
            -Dcheckstyle.skip \
            -Dlicense.skip \
            -Ddocker.logStdout=true \
            -Ddocker.skip.push=false \
            -Ddocker.verbose=true
        env:
          MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
          GITHUB_ACTOR: ${{ github.actor }}

      # 6️⃣ Debug build context
      - name: Inspect Docker Context
        run: |
          echo "📂 Context:"
          find cloud/docker-image -maxdepth 2 -type f
          echo "🧩 zpm.json snippet:"
          head -n 20 cloud/docker-image/src/main/docker/zpm.json || true

      # 7️⃣ Build Docker image using new multi-stage Dockerfile
      - name: Build Docker Image (no cache)
        run: |
          docker build --no-cache \
            -t ghcr.io/thealmikey/zillali:develop-SNAPSHOT \
            -f cloud/docker-image/Dockerfile \
            cloud/docker-image

      # 8️⃣ Inspect built image contents
      - name: Inspect Docker Image
        run: |
          docker images --format "{{.Repository}}:{{.Tag}}"
          docker run --rm ghcr.io/thealmikey/zillali:develop-SNAPSHOT \
            find /opt/zilla -maxdepth 3 -type f -name "*.jar" || true

      # 9️⃣ Cache built image for later reuse or debugging
      - name: Cache Docker Image Artifact
        if: success()
        run: |
          mkdir -p ~/docker-cache
          docker save -o ~/docker-cache/zillali.tar ghcr.io/thealmikey/zillali:develop-SNAPSHOT
        continue-on-error: true

      # 🔟 Login to GitHub Container Registry (GHCR)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # 1️⃣1️⃣ Upload diagnostics if build fails
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zilla-build-${{ github.event.number || github.run_id }}
          path: |
            **/hs_err_pid*.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
