name: Build and Publish Docker Image

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ develop, 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    environment: Zilla Env

    steps:
      # Checkout repository (full history)
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup JDK 22 using Temurin
      - name: Setup JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      # Verify Java and Maven versions
      - name: Verify tool versions
        run: |
          java -version
          ./mvnw -version

      # Ensure CR_PAT secret is present
      - name: Validate CR_PAT secret
        run: |
          if [ -n "${{ secrets.CR_PAT }}" ]; then
            echo "CR_PAT secret is set"
          else
            echo "CR_PAT secret is missing!"
            exit 1
          fi

      # Login to GitHub Container Registry before build
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # Build all Maven modules (Fabric8 handles Docker build + push)
      - name: Maven Build (with Docker push)
        run: |
          ./mvnw clean install \
            -B -U \
            -DskipTests \
            -Dcheckstyle.skip \
            -Dlicense.skip \
            -Ddocker.logStdout=true \
            -Ddocker.skip.push=false \
            -Ddocker.verbose=true
        env:
          MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
          GITHUB_ACTOR: ${{ github.actor }}

      # Inspect build context for debugging
      - name: Inspect Docker context
        run: |
          echo "Context files:"
          find cloud/docker-image -maxdepth 2 -type f
          echo "zpm.json snippet:"
          head -n 20 cloud/docker-image/src/main/docker/zpm.json || true

      # Inspect resulting Docker image (if built successfully)
      - name: Inspect Docker image
        run: |
          docker images --format "{{.Repository}}:{{.Tag}}"
          docker run --rm ghcr.io/thealmikey/zillali:develop-SNAPSHOT \
            find /opt/zilla -maxdepth 3 -type f -name "*.jar" || true

      # Cache the built Docker image for later reuse
      - name: Cache Docker image artifact
        if: success()
        run: |
          mkdir -p ~/docker-cache
          docker save -o ~/docker-cache/zillali.tar ghcr.io/thealmikey/zillali:develop-SNAPSHOT
        continue-on-error: true

      # Upload diagnostics if build fails
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zilla-build-${{ github.event.number || github.run_id }}
          path: |
            **/hs_err_pid*.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
